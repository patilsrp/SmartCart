# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/smartcart
spring.datasource.username=${DB_USERNAME:your_username}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (secret must be >= 64 chars for HS512)
jwt.secret=${JWT_SECRET:MyVerySecretKeyForJWTTokenGenerationAndValidationPurposeOnlyPadding12345}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI Service Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}

# Logging
logging.level.com.smartcart=INFO
logging.level.org.springframework.web=DEBUG

# Jackson Configuration
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null